name: Tests

on:
  push:
    branches: [main, build]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  godot-tests:
    name: Godot headless test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      - name: Import project
        run: |
          chmod +x godot
          ./godot --headless --path . --import

      - name: Run tests
        run: ./godot --headless --path . --script res://tests/test_runner.gd

      - name: Run playtest (boots the game, plays frames headless)
        run: ./godot --headless --path . --script res://tests/playtest.gd
